[package]
name = "dbms-desktop-menzies"
version = "0.1.0"
description = "Menzies OS Database Manager desktop app"
authors = ["Mariesta"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dirs = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = "0.3"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls", "tds73"] }
tokio-util = { version = "0.7", features = ["compat"] }
mongodb = { version = "2.8.2", default-features = false, features = ["tokio-runtime"] }
bson = { version = "2.13", features = ["chrono-0_4"] }
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.12.0"

# Size-oriented release (see menzies-os rule 11-smallest-app-size)
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
